# YOLO Autonomous Perception Configuration

model:
  variant: "yolov12m.pt" # Options: yolov8n, yolov11m, yolov12m
  task: "detect"

dataset:
  name: "Udacity-Self-Driving-Car"
  yaml_path: "data/data.yaml"
  classes: ["car", "truck", "pedestrian", "biker", "trafficLight", "trafficLight-Green", "trafficLight-GreenLeft", "trafficLight-Red", "trafficLight-RedLeft", "trafficLight-Yellow", "trafficLight-YellowLeft", "signal"]

training:
  epochs: 50
  imgsz: 640
  batch_size: 16
  device: 0 # GPU ID or 'cpu'
  optimizer: "AdamW"
  lr0: 0.001
  patience: 20
  project_name: "autonomous_perception"
  run_name: "yolov12_baseline"

inference:
  conf_threshold: 0.25
  iou_threshold: 0.45
  max_det: 300
